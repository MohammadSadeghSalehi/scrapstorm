name: ci

# Public GitHub Actions minutes are free. This workflow is headless: no
# Playwright, no GPU, no paid runners, no cloud deploy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  about:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: set description, homepage, topics
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              description: "Browser combat racer. NFS Most Wanted if the fight was the point. React + Three.js. Source here, assets on Hugging Face. Run locally.",
              homepage: "https://huggingface.co/datasets/Sadegh97/scrapstorm-assets",
            });
            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: ["threejs", "react", "webgl", "typescript", "game", "racing", "huggingface"],
            });

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: no leaked tokens
        run: |
          set +e
          git grep -I -E --line-number \
            'hf_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{10,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' \
            -- ':!package-lock.json'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "possible secret in the tree" >&2
            exit 1
          fi
          if [ "$status" -gt 1 ]; then
            echo "git grep failed" >&2
            exit 1
          fi
      - run: npm run bench
