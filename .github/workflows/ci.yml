name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/mission-smoke.mjs
      - run: node scripts/probe-audio.mjs
      - run: node scripts/check-track-profile.mjs
      - run: node scripts/check-setpiece-footprints.mjs
      - run: node scripts/balance-grid.mjs
